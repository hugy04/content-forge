# Render blueprint. Free tier: no card, 750 instance-hours a month.
#
# The free plan has no persistent disk and no Redis, so the hosted instance runs
# in `inline` mode and writes artifacts to /tmp - they survive until the next
# restart, which is fine for a live demo and wrong for production. The design
# doc states the production swap: Postgres for the run store, object storage for
# the artifacts, and queue mode behind a managed Redis.
services:
  - type: web
    name: content-forge
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn forge.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: TEXT_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard, never in git
      - key: GEMINI_MODEL
        # Pinned rather than left to auto-resolution. The newest ids are the
        # most capacity-constrained, and falling forward through two 503s costs
        # real seconds the draft stage then does not have. This id served all
        # four sample runs; the fall-forward stays as the safety net.
        value: gemini-3.5-flash-lite
      - key: TEXT_TIMEOUT_SECONDS
        value: "45"
      - key: BASIC_AUTH_USER
        sync: false          # set in the dashboard; blank leaves the app open
      - key: BASIC_AUTH_PASS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false          # only needed if TEXT_PROVIDER is switched to claude
      - key: RUN_MODE
        value: inline
      - key: IMAGE_PROVIDERS
        value: pollinations,card
        # Gemini is deliberately absent: a free AI Studio key has no image
        # quota at all, so leading with it spends a 429 round trip on every
        # run. The provider ships and is first in the chain on a paid key -
        # see docs/RUNBOOK.md.
      - key: SINKS
        value: local
      - key: OUT_DIR
        value: /tmp/forge/out
      - key: DB_PATH
        value: /tmp/forge/forge.db
      - key: DEADLINE_SECONDS
        value: "300"
      - key: POLLINATIONS_MIN_INTERVAL_SECONDS
        # Free Pollinations allows one image per 45s per IP, and a Render free
        # instance is one IP for all callers. Pacing beats retrying: the limiter
        # queues behind the deadline and degrades to the card if it cannot fit.
        value: "47"
